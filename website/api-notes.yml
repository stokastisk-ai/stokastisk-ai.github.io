# Documentation notes for SDK objects whose released source has no docstring (or an incomplete one).
# Written for this site from the pinned SDK source (sdk/stokastisk at SOURCE.lock.json sdk.commit); they are NOT SDK docstrings and
# never change the released wheel. Keys are dotted names. Fields: s summary, p {param: meaning}, r returns, x {Exception: when},
# e example, rel [related names], status "internal" for helpers that are public by naming only.
# scripts/gen_api_details.py renders them next to the signature extracted from the source; scripts/api_coverage.py counts an object as
# fully documented only when it has a summary (docstring or note) AND, if it takes parameters, a meaning for each non-obvious one.

