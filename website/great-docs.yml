      - validate_kaggle_t4
      - report
      - prohibited_report
      - discover_gpus
      - check_native_extensions
      - diagnostics.peer_access_matrix
      - diagnostics.flash_attn_native_loaded
      - prohibited.is_prohibited_path
      - prohibited.is_binary
      - prohibited.native_markers
      - prohibited.scan_members
      - prohibited.scan_wheel
      - prohibited.scan_tree
      - prohibited.flash_in_maps
      - prohibited.loaded_flash_libraries
  - title: "Compatibility checks"
    desc: "Offline model, dtype, quantization and feature checks backed by recorded Kaggle evidence."
    contents:
      - check_model
      - check_feature
      - check_dtype
      - check_quantization
      - feature_matrix
      - compat.get_feature
      - compat.FEATURES
      - compat.MODEL_EVIDENCE
      - compat.KAGGLE_VERIFIED_ARCHITECTURES
      - compat.QUANT_MIN_CAPABILITY
      - compat.BLOCKING
      - compat.read_registry
      - compat.find_missing_imports
      - compat.uses_removed_backend
      - dependencies
  - title: "Exceptions"
    desc: "Every exception raised by the SDK derives from StokastiskError."
    contents:
      - StokastiskError
      - ConfigurationError
      - UnsupportedParallelismError
      - InsufficientMemoryError
      - StokastiskCompatibilityError
      - EnvironmentValidationError
      - GPUDiscoveryError
      - TopologyError
      - EngineError
      - AttentionBackendError
      - EngineClosedError
      - EngineTimeoutError
      - EngineCloseError
      - StructuredOutputError
      - MissingDependencyError
      - ServerError
      - ServerStartupError
